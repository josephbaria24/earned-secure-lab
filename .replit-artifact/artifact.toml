kind = "mobile"
previewPath = "/earned-secure-lab/"
title = "Earned Secure Lab"
description = "A calm relationship wellness and attachment-style learning app with guided content, audio practices, personal insights, and mock subscription/admin demo flows."
version = "1.0.0"
id = "artifacts/earned-secure-lab"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/earned-secure-lab/" ]
localPort = 22809

[services.development]
run = "pnpm --filter @workspace/earned-secure-lab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/earned-secure-lab", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/earned-secure-lab", "run", "serve" ]

[services.env]
PORT = "22809"
BASE_PATH = "/earned-secure-lab/"
